    <script>
      // Suppress Vite HMR WebSocket transport warnings and errors when HMR is disabled in cloud sandboxes
      window.addEventListener('error', function (e) {
        if (
          (e.filename && e.filename.includes('@vite/client')) ||
          (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport')))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var str = String(e.reason || '');
        if (str.includes('WebSocket') || str.includes('createWebSocketModuleRunnerTransport') || str.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
